<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Camera with Drawing Overlay</title>
  <style>
    body { margin: 0; text-align: center; background: #111; color: #fff; font-family: sans-serif; }
    video, canvas { width: 100%; max-width: 480px; height: auto; }
    #overlay-img { position: absolute; top: 0; left: 0; width: 100%; pointer-events: none; }
    #camera-container { position: relative; display: inline-block; }
    #controls { margin-top: 10px; }
    input[type="file"] { color: #000; }
  </style>
</head>
<body>

  <h2>Camera with Drawing Overlay</h2>
  <div id="camera-container">
    <video id="camera" autoplay playsinline></video>
    <img id="overlay-img" src="" alt="Overlay" />
  </div>

  <div id="controls">
    <input type="file" accept="image/png" id="upload" />
    <button onclick="capture()">Capture</button>
    <a id="download" download="photo.png" style="display: none;">Download Photo</a>
  </div>

  <canvas id="canvas" style="display: none;"></canvas>

  <script>
    const video = document.getElementById('camera');
    const overlayImg = document.getElementById('overlay-img');
    const canvas = document.getElementById('canvas');
    const upload = document.getElementById('upload');
    const download = document.getElementById('download');

    // Start camera
    navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false })
      .then(stream => video.srcObject = stream)
      .catch(err => alert("Camera access denied: " + err));

    // Upload overlay drawing
    upload.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        overlayImg.src = URL.createObjectURL(file);
        overlayImg.onload = () => URL.revokeObjectURL(overlayImg.src);
      }
    });

    // Capture photo
    function capture() {
      const width = video.videoWidth;
      const height = video.videoHeight;
      canvas.width = width;
      canvas.height = height;

      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, width, height);

      if (overlayImg.src && overlayImg.complete) {
        ctx.drawImage(overlayImg, 0, 0, width, height);
      }

      const dataUrl = canvas.toDataURL('image/png');
      download.href = dataUrl;
      download.style.display = 'inline';
      download.click();
    }
  </script>

</body>
</html>
